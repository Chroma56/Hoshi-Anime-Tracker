# Builds the Hoshi desktop app (Rust / Tauri) for Windows on GitHub's own machines, so
# nothing needs installing on your computer.
#
# It runs when anything in desktop/ changes, or when you press "Run workflow" on the
# Actions tab. The installer ends up on the repository's Releases page.
name: Build desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write   # needed to publish the installer as a Release

concurrency:
  group: build-desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keeps compiled dependencies between runs: the first build takes about ten minutes,
      # later ones a few.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The icon is drawn here rather than uploaded: a light blue four-point star on a dark
      # rounded tile, the same as the site's. Tauri then makes every size Windows needs.
      - name: Draw the app icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $size = 1024
          $bmp = New-Object System.Drawing.Bitmap $size, $size
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = 'AntiAlias'
          $g.PixelOffsetMode = 'HighQuality'
          $g.Clear([System.Drawing.Color]::Transparent)
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 11, 11, 12))
          $r = [int]($size * 0.22); $d = $r * 2
          $tile = New-Object System.Drawing.Drawing2D.GraphicsPath
          $tile.AddArc(0, 0, $d, $d, 180, 90)
          $tile.AddArc($size - $d, 0, $d, $d, 270, 90)
          $tile.AddArc($size - $d, $size - $d, $d, $d, 0, 90)
          $tile.AddArc(0, $size - $d, $d, $d, 90, 90)
          $tile.CloseFigure()
          $g.FillPath($bg, $tile)
          $c = $size / 2.0; $R = $size * 0.36; $k = $R * 0.16
          $star = New-Object System.Drawing.Drawing2D.GraphicsPath
          $pts = @(@($c, ($c - $R)), @(($c + $R), $c), @($c, ($c + $R)), @(($c - $R), $c))
          for ($i = 0; $i -lt 4; $i++) {
            $a = $pts[$i]; $b = $pts[($i + 1) % 4]
            $sx = [Math]::Sign(($a[0] + $b[0]) / 2 - $c); $sy = [Math]::Sign(($a[1] + $b[1]) / 2 - $c)
            $ctrl = New-Object System.Drawing.PointF ([single]($c + $sx * $k)), ([single]($c + $sy * $k))
            $p1 = New-Object System.Drawing.PointF ([single]$a[0]), ([single]$a[1])
            $p2 = New-Object System.Drawing.PointF ([single]$b[0]), ([single]$b[1])
            $star.AddBezier($p1, $ctrl, $ctrl, $p2)
          }
          $star.CloseFigure()
          $rect = New-Object System.Drawing.RectangleF 0, 0, $size, $size
          $grad = New-Object System.Drawing.Drawing2D.LinearGradientBrush $rect, ([System.Drawing.Color]::FromArgb(255, 116, 191, 255)), ([System.Drawing.Color]::FromArgb(255, 240, 247, 255)), 45
          $g.FillPath($grad, $star)
          $g.Dispose()
          $bmp.Save((Join-Path (Get-Location) 'app-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host "Drew app-icon.png"

      - name: Make the icon sizes
        run: npx --yes @tauri-apps/cli@2 icon app-icon.png

      - name: Build the app
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect the files
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "The installer was not produced." }
          Copy-Item $setup.FullName "out/Hoshi-Setup-$version.exe"
          # The program itself also runs without installing (it needs the WebView2 runtime,
          # which Windows 10 and 11 already have).
          Copy-Item src-tauri/target/release/hoshi.exe "out/Hoshi-Portable-$version.exe"
          Get-ChildItem out | ForEach-Object { "{0,10:N0} bytes  {1}" -f $_.Length, $_.Name }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: Hoshi-windows
          path: desktop/out/*.exe
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.files.outputs.version }}
          name: Hoshi for Windows ${{ steps.files.outputs.version }}
          body: |
            **Hoshi-Setup** installs Hoshi with a Start menu shortcut.
            **Hoshi-Portable** runs without installing.

            Windows will warn that the publisher is unknown, because the app is not code-signed. Choose "More info", then "Run anyway".
          files: desktop/out/*.exe
