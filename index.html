<script>
var API_BASE = "https://anikotoapi.site";

var SAMPLE = [
  { id: 9044, title: "The Iceblade Sorcerer II", meta: "TV · 2026 · 6.7", ep: "12 eps", genres: ["Action", "Fantasy"], img: "https://cdn.anipixcdn.co/thumbnail/20346dad019e8ccda67ad24ebee17d3c.jpg" },
  { id: 8903, title: "The Exiled Heavy Knight", meta: "TV · 2026 · 7.1", ep: "26 eps", genres: ["Action", "Fantasy"], img: "https://cdn.anipixcdn.co/thumbnail/81d8f6bc61e91eeecbb1e08f767c475a.jpg" },
  { id: 9036, title: "The Ramparts of Ice Season 2", meta: "TV · 2026 · 8.4", ep: "Airing", genres: ["Drama", "Romance"], img: "https://cdn.anipixcdn.co/thumbnail/b6ae71493beee188609a8cceeb22e5f1.jpg" }
];

var GENRES = ["Action", "Adventure", "Comedy", "Drama", "Fantasy", "Romance", "Sci-Fi", "Slice of Life", "Mystery", "Sports"];
var data = SAMPLE;

function card(a, rank) {
  var el = document.createElement("a");
  el.href = "#title";
  el.onclick = function(e) { e.preventDefault(); openTitle(a); };
  el.className = "card";

  if (rank) {
    var n = document.createElement("span");
    n.className = "num";
    n.textContent = rank;
    el.appendChild(n);
  }

  var p = document.createElement("div");
  p.className = "poster";

  if (a.img) {
    var im = new Image();
    im.loading = "lazy";
    im.decoding = "async";
    im.alt = "";
    im.src = a.img;
    p.appendChild(im);
  } else {
    p.textContent = a.title.split(" ").slice(0, 3).join(" ");
  }

  if (a.ep) {
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = a.ep;
    p.appendChild(b);
  }

  var t = document.createElement("h3");
  t.textContent = a.title;
  var m = document.createElement("p");
  m.textContent = a.meta;

  el.appendChild(p);
  el.appendChild(t);
  el.appendChild(m);
  return el;
}

function fill(id, list, ranked) {
  var r = document.getElementById(id);
  if (!r) return;
  r.innerHTML = "";
  list.forEach(function(a, i) { r.appendChild(card(a, ranked ? i + 1 : 0)); });
}

function render() {
  fill("trending", data.slice(0, 8), true);
  fill("season", window.__s || data.slice(0, 10));
  pick(window.__g || "Action");
}

function pick(g) {
  window.__g = g;
  var tabs = document.getElementById("tabs");
  if (!tabs) return;
  tabs.innerHTML = "";
  GENRES.forEach(function(x) {
    var b = document.createElement("button");
    b.textContent = x;
    if (x === g) b.className = "on";
    b.onclick = function() { pick(x); };
    tabs.appendChild(b);
  });
  var l = data.filter(function(a) { return a.genres.indexOf(g) > -1; });
  fill("genre", l.length ? l : data.slice(0, 5));
}

function fetchApi(url) {
  return fetch(url, {
    method: "GET",
    headers: { "Accept": "application/json" }
  }).then(function(r) { return r.json(); });
}

// Mapper for Anikoto API schema
function parseAnikotoList(res) {
  var rawData = Array.isArray(res) ? res : (res.data || res.results || []);
  return rawData.map(function(x) {
    var genres = (x.terms_by_type && x.terms_by_type.genre) ? x.terms_by_type.genre : (x.genres || ["Action"]);
    var type = (x.terms_by_type && x.terms_by_type.type && x.terms_by_type.type[0]) || "TV";
    return {
      id: x.id,
      title: x.title || x.name || "Untitled",
      meta: type + " · " + (x.year || "2026") + " · " + (x.score || "N/A"),
      ep: x.episodes ? (x.episodes + " eps") : "Airing",
      genres: genres,
      img: x.poster || x.image || x.coverImage,
      description: x.description || ""
    };
  });
}

// Fetch recent anime from API
fetchApi(API_BASE + "/recent-anime?page=1&per_page=30")
  .then(function(res) {
    var parsed = parseAnikotoList(res);
    if (!parsed.length) return;
    data = parsed;
    var note = document.getElementById("note");
    if (note) note.style.display = "none";
    LIVE = true;
    render();
  })
  .catch(function() { render(); });

var LIVE = false, tok = 0, timer = 0;
var F = { sort: "TRENDING_DESC", format: "", season: "", year: "", status: "", genres: [] };

function Q() { return document.getElementById("q") ? document.getElementById("q").value.trim() : ""; }

function local() {
  var q = Q().toLowerCase();
  var l = data.filter(function(a) { return !q || a.title.toLowerCase().indexOf(q) > -1; });
  return Promise.resolve(l);
}

function live() {
  return fetchApi(API_BASE + "/recent-anime?page=1&per_page=30")
    .then(function(res) {
      var list = parseAnikotoList(res);
      var q = Q().toLowerCase();
      return list.filter(function(a) { return !q || a.title.toLowerCase().indexOf(q) > -1; });
    })
    .catch(function() { return local(); });
}

function draw(l) {
  var g = document.getElementById("grid");
  if (!g) return;
  var f = document.createDocumentFragment();
  l.forEach(function(a) { f.appendChild(card(a, 0)); });
  g.innerHTML = "";
  g.appendChild(f);
  var cnt = document.getElementById("count");
  if (cnt) cnt.textContent = l.length ? l.length + " titles" : "No titles match.";
}

function run() {
  var t = ++tok;
  (LIVE ? live() : local()).then(function(l) { if (t === tok) draw(l); }).catch(function() { local().then(draw); });
}

var qEl = document.getElementById("q");
if (qEl) {
  qEl.addEventListener("input", function() {
    if (location.hash !== "#discover") location.hash = "discover";
    clearTimeout(timer);
    timer = setTimeout(run, 300);
  });
}

var CUR = null, LIB = {};
try { LIB = JSON.parse(localStorage.getItem("hoshi-lib") || "{}"); } catch (e) {}
function saveLib() { try { localStorage.setItem("hoshi-lib", JSON.stringify(LIB)); } catch (e) {} }

function openTitle(a) { CUR = a; location.hash = "title"; }
function mk(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; }

// Detail view and Episode Streaming integration
function detail(a) {
  if (!a) return;
  var d = document.getElementById("detail");
  if (!d) return;
  d.innerHTML = "";

  var back = mk("button", "back", "\u2190 Back");
  back.onclick = function() { history.back(); };
  d.appendChild(back);

  var wrap = mk("div", "dwrap");
  var ph = mk("div", "poster dposter");

  if (a.img) {
    var im = new Image();
    im.alt = ""; im.decoding = "async"; im.src = a.img;
    ph.appendChild(im);
  } else {
    ph.textContent = a.title;
  }

  var playBtn = mk("button", "play-btn show");
  playBtn.type = "button";
  playBtn.setAttribute("aria-label", "Play Episode 1");
  playBtn.appendChild(mk("span", "", "\u25b6"));
  ph.appendChild(playBtn);

  var info = mk("div", "dinfo");
  info.appendChild(mk("h1", "", a.title));
  info.appendChild(mk("p", "sub", a.meta + (a.ep ? " \u00b7 " + a.ep : "")));

  var g = mk("div", "tabs");
  (a.genres || []).forEach(function(x) { g.appendChild(mk("span", "tag", x)); });
  info.appendChild(g);

  var desc = mk("p", "desc", a.description || "Loading series details...");
  info.appendChild(desc);

  // Sub/Dub Toggle Controls
  var langWrap = mk("div", "sctl");
  var subBtn = mk("button", "on", "Sub");
  var dubBtn = mk("button", "", "Dub");
  var currentLang = "sub";

  langWrap.appendChild(subBtn);
  langWrap.appendChild(dubBtn);
  info.appendChild(langWrap);

  info.appendChild(mk("h2", "", "Select Episode"));
  var wl = mk("div", "wlist");
  info.appendChild(wl);

  wrap.appendChild(ph);
  wrap.appendChild(info);
  d.appendChild(wrap);

  // Fetch full episode array using series database ID
  var targetId = a.id || 9044;
  var seriesUrl = API_BASE + "/series/" + targetId;

  fetchApi(seriesUrl).then(function(res) {
    if (CUR !== a) return;

    var episodes = Array.isArray(res) ? res : (res.episodes || res.data || []);
    if (!episodes.length) {
      desc.textContent = a.description || "No episode streams found for this series.";
      return;
    }

    if (res.description) desc.textContent = res.description;

    function renderEpisodes() {
      wl.innerHTML = "";
      episodes.forEach(function(ep, index) {
        var epNum = ep.number || (index + 1);
        var epTitle = ep.title ? (" - " + ep.title) : "";
        var btn = mk("a", "", "Episode " + epNum + epTitle);
        btn.href = "#";

        btn.onclick = function(e) {
          e.preventDefault();
          var streamUrl = ep.embed_url ? ep.embed_url[currentLang] : (ep.url || ep.streamUrl);
          if (streamUrl) {
            openEpisodePlayer(streamUrl);
          } else {
            alert("No " + currentLang.toUpperCase() + " stream available for this episode.");
          }
        };
        wl.appendChild(btn);
      });
    }

    playBtn.onclick = function() {
      var ep1 = episodes[0];
      var url = ep1 && ep1.embed_url ? ep1.embed_url[currentLang] : (ep1 ? ep1.url : null);
      if (url) openEpisodePlayer(url);
    };

    subBtn.onclick = function() {
      currentLang = "sub";
      subBtn.className = "on";
      dubBtn.className = "";
      renderEpisodes();
    };

    dubBtn.onclick = function() {
      currentLang = "dub";
      dubBtn.className = "on";
      subBtn.className = "";
      renderEpisodes();
    };

    renderEpisodes();
  }).catch(function() {
    desc.textContent = "Unable to fetch episode list. Ensure CORS headers are enabled on the server.";
  });
}

function openEpisodePlayer(url) {
  if (!url) return;
  var frame = document.getElementById("playerFrame");
  var overlay = document.getElementById("playerOverlay");
  if (frame && overlay) {
    frame.src = url;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
  }
}

function closeTrailer() {
  var frame = document.getElementById("playerFrame");
  var overlay = document.getElementById("playerOverlay");
  if (frame) frame.src = "";
  if (overlay) overlay.hidden = true;
  document.body.style.overflow = "";
}

document.addEventListener("keydown", function(e) {
  var overlay = document.getElementById("playerOverlay");
  if (e.key === "Escape" && overlay && !overlay.hidden) closeTrailer();
});

function route() {
  var h = location.hash;
  if (h === "#title" && !CUR) h = "";
  var V = { "#discover": "discover", "#title": "detail", "#library": "library", "#manga": "manga", "#schedule": "schedule" };
  var v = V[h] || "home";

  ["home", "discover", "detail", "library", "manga", "schedule"].forEach(function(n) {
    var el = document.getElementById(n);
    if (el) el.hidden = (n !== v);
  });

  if (v === "detail") detail(CUR);
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();
</script>
